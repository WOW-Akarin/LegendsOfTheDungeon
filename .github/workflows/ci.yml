name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.404
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'

      - name: Show SDK
        run: dotnet --info

      - name: Enable verification scripts
        run: chmod +x eng/verify.sh eng/verify-negative-gates.sh

      - name: Restore, build, unit and architecture tests
        run: ./eng/verify.sh

      - name: Verify negative build and test gates
        run: ./eng/verify-negative-gates.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 14
