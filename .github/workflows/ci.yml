name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10.0.404
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.404'

      - name: Show SDK
        run: dotnet --info

      - name: Enable verification scripts
        run: chmod +x eng/verify.sh eng/verify-negative-gates.sh eng/verify-documentation-gates.sh eng/verify-kernel-contract-gates.sh

      - name: Restore, build, unit and architecture tests
        run: ./eng/verify.sh

      - name: Verify negative build, unit and architecture gates
        run: ./eng/verify-negative-gates.sh

      - name: Verify documentation quality gate
        run: ./eng/verify-documentation-gates.sh

      - name: Upload documentation gate evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: documentation-gate
          path: artifacts/documentation-gate/**
          if-no-files-found: warn
          retention-days: 14

      - name: Verify Kernel Strong ID compile contracts
        run: ./eng/verify-kernel-contract-gates.sh

      - name: Upload Kernel contract gate evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kernel-contract-gate
          path: artifacts/kernel-contract-gate/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  persistence-integration:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: lotd_test
          POSTGRES_PASSWORD: ephemeral_test_password
          POSTGRES_DB: lotd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lotd_test -d lotd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      CI: 'true'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      LOTD_TEST_POSTGRES: 'Host=127.0.0.1;Port=5432;Username=lotd_test;Password=ephemeral_test_password;Database=lotd_test;Maximum Pool Size=1;Timeout=10'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10.0.404
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.404'

      - name: Restore pinned Npgsql integration package graph
        run: dotnet restore tests/Integration/LegendsOfTheDungeon.PersistenceProbe/LegendsOfTheDungeon.PersistenceProbe.csproj --locked-mode

      - name: Run real PostgreSQL 18 persistence probes
        run: |
          set -o pipefail
          mkdir -p artifacts/persistence-integration
          dotnet run --project tests/Integration/LegendsOfTheDungeon.PersistenceProbe/LegendsOfTheDungeon.PersistenceProbe.csproj --configuration Release --no-restore | tee artifacts/persistence-integration/report.txt

      - name: Upload PostgreSQL integration report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: persistence-integration
          path: artifacts/persistence-integration/report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Record actual PostgreSQL image digest
        run: docker image inspect postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc --format '{{json .RepoDigests}}'

  networking-loopback:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10.0.404
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.404'

      - name: Restore pinned P13 networking probe graph
        run: dotnet restore tests/Integration/LegendsOfTheDungeon.NetworkingProbe/LegendsOfTheDungeon.NetworkingProbe.csproj --locked-mode

      - name: Run real TCP loopback protocol and shutdown probes
        run: |
          set -o pipefail
          mkdir -p artifacts/networking-loopback
          dotnet run --project tests/Integration/LegendsOfTheDungeon.NetworkingProbe/LegendsOfTheDungeon.NetworkingProbe.csproj --configuration Release --no-restore | tee artifacts/networking-loopback/report.txt

      - name: Upload networking loopback report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: networking-loopback
          path: artifacts/networking-loopback/report.txt
          if-no-files-found: warn
          retention-days: 14

  diagnostics-integration:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10.0.404
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.404'

      - name: Restore pinned P14 diagnostics probe graph
        run: dotnet restore tests/Integration/LegendsOfTheDungeon.DiagnosticsProbe/LegendsOfTheDungeon.DiagnosticsProbe.csproj --locked-mode

      - name: Execute real Worker telemetry isolation and bounded-state probes
        run: |
          set -o pipefail
          mkdir -p artifacts/diagnostics-integration
          dotnet run --project tests/Integration/LegendsOfTheDungeon.DiagnosticsProbe/LegendsOfTheDungeon.DiagnosticsProbe.csproj --configuration Release --no-restore | tee artifacts/diagnostics-integration/report.txt

      - name: Upload diagnostics integration report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diagnostics-integration
          path: artifacts/diagnostics-integration/report.txt
          if-no-files-found: warn
          retention-days: 14

  staticdata-postgres:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: lotd_test
          POSTGRES_PASSWORD: ephemeral_test_password
          POSTGRES_DB: lotd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lotd_test -d lotd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      CI: 'true'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      LOTD_TEST_POSTGRES: 'Host=127.0.0.1;Port=5432;Username=lotd_test;Password=ephemeral_test_password;Database=lotd_test;Maximum Pool Size=1;Timeout=10'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10.0.404
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.404'

      - name: Restore locked P15 static data PostgreSQL probe graph
        run: dotnet restore tests/Integration/LegendsOfTheDungeon.StaticDataProbe/LegendsOfTheDungeon.StaticDataProbe.csproj --locked-mode

      - name: Run real PostgreSQL catalog parity and failure probes
        run: |
          set -o pipefail
          mkdir -p artifacts/staticdata-postgres
          dotnet run --project tests/Integration/LegendsOfTheDungeon.StaticDataProbe/LegendsOfTheDungeon.StaticDataProbe.csproj --configuration Release --no-restore | tee artifacts/staticdata-postgres/report.txt

      - name: Upload static data PostgreSQL report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: staticdata-postgres
          path: artifacts/staticdata-postgres/report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Record PostgreSQL image digest
        run: docker image inspect postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc --format '{{json .RepoDigests}}'

  world-execution:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10.0.404
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.404'

      - name: Locked restore WorldExecutor integration graph
        run: dotnet restore tests/Integration/LegendsOfTheDungeon.WorldExecutionProbe/LegendsOfTheDungeon.WorldExecutionProbe.csproj --locked-mode

      - name: Real concurrent WorldExecutor permission and recovery probes
        run: |
          set -o pipefail
          mkdir -p artifacts/world-execution
          dotnet run --project tests/Integration/LegendsOfTheDungeon.WorldExecutionProbe/LegendsOfTheDungeon.WorldExecutionProbe.csproj --configuration Release --no-restore | tee artifacts/world-execution/report.txt

      - name: Upload world execution probe report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-execution
          path: artifacts/world-execution/report.txt
          if-no-files-found: warn
          retention-days: 14

  world-lifecycle:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10.0.404
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.404'

      - name: Locked restore P17 world lifecycle integration graph
        run: dotnet restore tests/Integration/LegendsOfTheDungeon.WorldLifecycleProbe/LegendsOfTheDungeon.WorldLifecycleProbe.csproj --locked-mode

      - name: Run real parallel worlds and lifecycle cleanup probes
        run: |
          set -o pipefail
          mkdir -p artifacts/world-lifecycle
          dotnet run --project tests/Integration/LegendsOfTheDungeon.WorldLifecycleProbe/LegendsOfTheDungeon.WorldLifecycleProbe.csproj --configuration Release --no-restore | tee artifacts/world-lifecycle/report.txt

      - name: Upload world lifecycle integration evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: world-lifecycle
          path: artifacts/world-lifecycle/report.txt
          if-no-files-found: warn
          retention-days: 14
